apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: mern-app

# ── Build ──────────────────────────────────────────
build:
  tagPolicy:
    sha256: {}
  local:
    push: false
  artifacts:
    - image: sandbox
      context: sandbox/server
      docker:
        dockerfile: dockerfile.dev
      sync:
        infer:
          - "src/**"
    - image: router
      context: sandbox/router
      docker:
        dockerfile: dockerfile.dev
      sync:
        infer:
          - "src/**"
    - image: agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: template
      context: sandbox/template
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"
    - image: ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile.dev
      sync:
        infer:
          - "src/**"

# ── Manifests ──────────────────────────────────────
manifests:
  rawYaml:
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/ingress.yml
    
# ── Port Forwarding ────────────────────────────────
