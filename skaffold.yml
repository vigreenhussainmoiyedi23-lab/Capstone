apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: mern-app

# ── Build ──────────────────────────────────────────
build:
  local:
    push: false        # use local images, don't push to registry
  artifacts:
    - image: sandbox
      context: sandbox/server      
      docker:
        dockerfile: dockerfile.dev
      sync:
        manual:            
          - src: '**/*.js'    
            dest: /app
          - src: '**/*.json'
            dest: /app
    - image : router
      context: sandbox/router
      docker:
        dockerfile: dockerfile.dev
      sync:
        manual:
          - src: '**/*.js'
            dest: /app
          - src: '**/*.json'
            dest: /app        
    - image: agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile
      sync:
        manual:
          - src: '**/*.js'
            dest: /app
          - src: '**/*.json'
            dest: /app 

    - image: template
      context: sandbox/template
      docker:
        dockerfile: dockerfile
      sync:
        manual:
          - src: '**/*.js'
            dest: /app
          - src: '**/*.json'
            dest: /app 


# ── Manifests ──────────────────────────────────────
manifests:
  rawYaml:
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/ingress.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml

# ── Port Forwarding ────────────────────────────────
portForward:
  - resourceType: service
    resourceName: sandbox-service
    port: 80
    localPort: 3000
