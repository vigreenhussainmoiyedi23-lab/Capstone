apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: auth:latest
          imagePullPolicy: IfNotPresent
          name: auth-container
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /status/readyz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          envFrom:
            - secretRef:
                name: google

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: JWT_SECRET
            - name: AUTH_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: AUTH_MONGO_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: REDIS_URL
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: urls
                  key: FRONTEND_URL
          ports:
            - containerPort: 3000
              name: auth-port
